[package]
name = "mojang-api"
version = "0.1.0"
edition = "2024"


[dependencies]
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
dirs = "6.0.0"
sha1 = "0.11.0"
hex = "0.4.3"
serde_json = "1.0.151"

